<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Finance Logger</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="wrapper">
            <h1>Finance Logger</h1>

            <!-- output list -->
            <ul class="item-list"></ul>
        </div>

        <section>
            <form class="new-item-form">
                <div class="field">
                    <label>Type:</label>
                    <select id="type" title="Type">
                        <option value="invoice">Invoice</option>
                        <option value="payment">Payment</option>
                    </select>
                </div>
                <div class="field">
                    <label>To / From:</label>
                    <input type="text" id="tofrom" placeholder="Enter recipient or sender" title="To / From" />
                </div>
                <div class="field">
                    <label>Details:</label>
                    <input type="text" id="details" title="Details" placeholder="Enter details" />
                </div>
                <div class="field">
                    <label>Amount (£):</label>
                    <input type="number" id="amount" title="Amount (£)" placeholder="Enter amount" />
                </div>
                <button type="submit">Add</button>
            </form>

            <a href="https://vinald.github.io">[Vinald]</a>
        </section>

        <script type="module" src="./dist/app.js"></script>
    </body>
</html>
